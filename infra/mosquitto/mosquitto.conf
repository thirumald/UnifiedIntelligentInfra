# Eclipse Mosquitto 2.x — MQTT ingress for OT gateways / IoT devices
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --- Authentication / authorisation -----------------------------------------
per_listener_settings false
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# --- Flow control ------------------------------------------------------------
max_inflight_messages 100
max_queued_messages 10000
message_size_limit 262144
max_keepalive 300

# --- Listeners ---------------------------------------------------------------
# Native MQTT (devices, OT gateways, ingest-bridge)
listener 1883
protocol mqtt

# MQTT over WebSockets (browser-based commissioning tools)
listener 9001
protocol websockets

# Production: add TLS listener on 8883 and mount certs, e.g.
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# require_certificate true
